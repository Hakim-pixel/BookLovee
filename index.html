<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Made In Gxyer</title>
  <style>
    :root {
      --book-width: 90vmin; /* gunakan vmin supaya proporsional di hp p*/
      --book-height: 60vmin;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: linear-gradient(-45deg, tomato, purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

    #book {
      width: var(--book-width);
      height: var(--book-height);
      position: relative;
      perspective: 150vmin;
      transform-origin: center;
    }

    #book:before {
      content: '';
      width: 2%;
      height: 100%;
      background: #222;
      position: absolute;
      left: 49%;
      top: 0;
      box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.75);
      z-index: 10;
    }

    .page {
      width: 50%;
      height: 100%;
      background: radial-gradient(circle at 0% 100%, #777, #ddd 70%);
      position: absolute;
      left: 50%;
      top: 0;
      transition: z-index 0.01s linear 1s, transform 2s linear;
      transform-origin: 0% 50%;
      z-index: 7;
      cursor: pointer;
    }

    .front, .back {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.1s linear 1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .front { opacity: 1; }
    .back { transform: scaleX(-1); }

    input { display: none; }

    label {
      width: 100%;
      height: 100%;
      z-index: 99;
      position: absolute;
      left: 0;
      top: 0;
    }

    input:checked + .page { transform: rotateY(-180deg); }
    input:checked + .page .front { opacity: 0; }
    input:checked + .page .back { opacity: 1; }

    #seven:checked + .page { z-index: 7; }
    #six:checked + .page   { z-index: 6; }
    #five:checked + .page  { z-index: 5; }
    #four:checked + .page  { z-index: 4; }
    #three:checked + .page { z-index: 3; }
    #two:checked + .page   { z-index: 2; }
    #one:checked + .page   { z-index: 1; }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    .content img {
      width: 70%;
      height: auto;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* COVER */
    #page1 .front {
      background: #6b6b6b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #page1 .front .cover-plaque {
      width: 60%;
      aspect-ratio: 1 / 1;
      background: #6b6b6b;
      position: relative;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
    }

    #page1 .front .cover-plaque::before {
      content: '';
      position: absolute;
      width: 120%;
      height: 120%;
      border-radius: 50%;
      background: #0a0a0a;
      right: -10%;
      top: -10%;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.2);
    }

    #page1 .front .cover-text {
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    #page1 .front .cover-text p {
      margin: 0;
      font-weight: 300;
      letter-spacing: 6px;
      color: #e7a3df;
      font-size: 2.5vmin;
      text-shadow: 0 0 6px rgba(231,163,223,0.7);
    }

    /* BACK PAGES */
    #page1 .back { background: #222; color: white; }
    #page1 .back::before { content: 'Katakan Cintaaa'; }

    #page2 .front { background: #001f3f; }
    #page2 .back { background: white; color: tomato; }
    #page2 .back::before { content: 'hati ini memintaa'; }

    #page3 .front { background: #111; }
    #page3 .back { background: #111; color: #ff99cc; }
    #page3 .back::before { content: 'Kau lebih dari teman berbagi'; }

    #page4 .front { background: #fff0f5; }
    #page4 .back { background: #fff5f8; color: #d63384; }
    #page4 .back::before { content: 'jadi kekasih ku sajaa'; }

    #page5 .front { background: #000; }
    #page5 .back { background: #111; color: #d63384; }
    #page5 .back::before { content: 'Cinta Katakan Cintaa'; }

    #page6 .front { background: #fff0f5; }
    #page6 .back { background: #fff0f5; color: #d63384; }
    #page6 .back::before { content: 'Hati Ini Memintaa'; }

    #page7 .front { background: #2b2b2b; }
    #page7 .back { background: #000; color: #fff0f5; }
    #page7 .back::before { content: 'Kau Lebih Dari Teman Berbagi💕'; }

    /* Hati jatuh */
    .heart {
      position: fixed;
      top: -10px;
      color: pink;
      font-size: 20px;
      animation: fall 5s linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

  </style>
</head>
<body>
  <audio id="bg-music" loop>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <div id="book">
    <input type="checkbox" id="seven">
    <div id="page7" class="page">
      <div class="front"><div class="content"><img src="./2.jpeg" alt="love"></div></div>
      <div class="back"></div><label for="seven"></label>
    </div>

    <input type="checkbox" id="six">
    <div id="page6" class="page">
      <div class="front"><div class="content"><img src="./6.jpeg" alt="love"></div></div>
      <div class="back"></div><label for="six"></label>
    </div>

    <input type="checkbox" id="five">
    <div id="page5" class="page">
      <div class="front"><div class="content"><img src="./5.jpeg" alt="love"></div></div>
      <div class="back"></div><label for="five"></label>
    </div>

    <input type="checkbox" id="four">
    <div id="page4" class="page">
      <div class="front"><div class="content"><img src="./4.jpeg" alt="love"></div></div>
      <div class="back"></div><label for="four"></label>
    </div>

    <input type="checkbox" id="three">
    <div id="page3" class="page">
      <div class="front"><div class="content"><img src="./3.jpeg" alt="love"></div></div>
      <div class="back"></div><label for="three"></label>
    </div>

    <input type="checkbox" id="two">
    <div id="page2" class="page">
      <div class="front"><div class="content"><img src="./1.jpeg" alt="love"></div></div>
      <div class="back"></div><label for="two"></label>
    </div>

    <input type="checkbox" id="one">
    <div id="page1" class="page">
      <div class="front">
        <div class="cover-plaque">
          <div class="cover-text"><p>Lovee💕</p></div>
        </div>
      </div>
      <div class="back"></div><label for="one"></label>
    </div>
  </div>

  <script>
    // Cegah spam klik cepat
    document.querySelectorAll('.page').forEach(page => {
      page.addEventListener('click', function() {
        this.style.pointerEvents = "none";
        setTimeout(() => { this.style.pointerEvents = ""; }, 2000);
      });
    });

    // Putar musik saat pertama kali disentuh
    const music = document.getElementById("bg-music");
    document.body.addEventListener("touchstart", startMusic, { once: true });
    document.body.addEventListener("click", startMusic, { once: true });
    function startMusic() {
      if (music.paused) music.play().catch(()=>{});
    }

    // Efek hati jatuh
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 10 + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
